    <script>
      (function () {
        var retryKey = "podpilot:asset-reload-attempted";
        function getRetryFlag() {
          try {
            return window.sessionStorage && window.sessionStorage.getItem(retryKey);
          } catch (error) {
            return null;
          }
        }

        function setRetryFlag(value) {
          try {
            if (window.sessionStorage) window.sessionStorage.setItem(retryKey, value);
          } catch (error) {
            return;
          }
        }

        function clearRetryFlag() {
          try {
            if (window.sessionStorage) window.sessionStorage.removeItem(retryKey);
          } catch (error) {
            return;
          }
        }

        window.addEventListener("error", function (event) {
          var target = event.target;
          var tagName = target && target.tagName ? target.tagName.toLowerCase() : "";
          var source = target && (target.src || target.href || "");
          if ((tagName === "script" || tagName === "link") && source.indexOf("/assets/") !== -1) {
            if (getRetryFlag() === "1") return;
            setRetryFlag("1");
            var url = new URL(window.location.href);
            url.searchParams.set("podpilot_reload", Date.now().toString());
            window.location.replace(url.toString());
          }
        }, true);

        window.addEventListener("load", function () {
          clearRetryFlag();
        });
      }());
    </script>
