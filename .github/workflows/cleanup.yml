name: Nightly Storage Cleanup

on:
  workflow_dispatch:
    # Manual maintenance only. Production cleanup runs on the VPS systemd timer.
    inputs:
      dry_run:
        description: 'Run in Dry Run mode (simulate only)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      confirm:
        description: 'Confirm live expired-design deletion (required when dry_run=false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      cutoff_hours:
        description: 'Cutoff hours for designs'
        required: true
        default: '24'
        type: string
      scan_orphan_r2:
        description: 'Run an opt-in dry-run scan for orphaned R2 objects'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  cleanup:
    name: Execute Storage Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Validate Secrets Setup
        run: |
          if [ -z "${{ secrets.PODPILOT_API_URL }}" ]; then
            echo "::error::PODPILOT_API_URL secret is not set in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.ADMIN_CLEANUP_SECRET }}" ]; then
            echo "::error::ADMIN_CLEANUP_SECRET secret is not set in GitHub Repository Secrets."
            exit 1
          fi

      - name: Clean Expired Design Workspaces
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          CONFIRM="${{ inputs.confirm }}"
          CUTOFF="${{ inputs.cutoff_hours }}"

          if [ "$DRY_RUN" = "false" ] && [ "$CONFIRM" != "true" ]; then
            echo "::error::Live cleanup requires confirm=true. No cleanup request was sent."
            exit 1
          fi
          
          echo "Triggering design cleanup... (dry_run=$DRY_RUN, confirm=$CONFIRM, cutoff_hours=$CUTOFF)"
          
          # Perform POST request and fetch HTTP response code and body
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.PODPILOT_API_URL }}/api/admin/cleanup-old-designs?dry_run=$DRY_RUN&confirm=$CONFIRM&cutoff_hours=$CUTOFF" \
            -H "X-Cleanup-Secret: ${{ secrets.ADMIN_CLEANUP_SECRET }}" \
            -H "Content-Type: application/json")
          
          # Extract body and HTTP status code
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Design cleanup failed with status code $HTTP_STATUS"
            exit 1
          fi

      - name: Scan Orphaned R2 Storage Objects (Dry Run Only)
        if: ${{ inputs.scan_orphan_r2 == 'true' }}
        run: |
          # The endpoint has no object-age filter. Keep workflow use scan-only;
          # live orphan deletion requires separate review and a 48-hour grace period.
          echo "Scanning orphan R2 assets... (dry_run=true; no objects will be deleted)"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.PODPILOT_API_URL }}/api/admin/cleanup-orphan-r2-objects?dry_run=true&confirm=false" \
            -H "X-Cleanup-Secret: ${{ secrets.ADMIN_CLEANUP_SECRET }}" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Orphan R2 assets scan failed with status code $HTTP_STATUS"
            exit 1
          fi
