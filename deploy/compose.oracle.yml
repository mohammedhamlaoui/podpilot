services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: podpilot-api:local
    env_file:
      - /etc/podpilot/backend.env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.oracle:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
